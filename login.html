<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: whitesmoke;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 20px;
      box-shadow: 0 0 15px gray;
      border-radius: 10px;
      width: 400px;
    }

    h2 {
      text-align: center;
      color: black;
    }

    .form-group {
      margin-bottom: 15px;
      width: 380px;
    }

    label {
      font-weight: bold;
      display: block;
      color: dimgray;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid lightgray;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: mediumseagreen;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: seagreen;
    }

    .switch {
      text-align: center;
      margin-top: 10px;
    }

    .switch a {
      text-decoration: none;
      color: mediumseagreen;
      font-weight: bold;
    }

    .switch a:hover {
      color: seagreen;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Login</h2>
    <form action="#" method="POST">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="loginEmail" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="loginPassword" required />
      </div>
      <button type="submit">Login</button>
    </form>
    <div class="switch">
      Don't have an account? <a href="#" onclick="alert('Redirect to registration page')">Register here</a>
    </div>
  </div>

</body>
</html>
