<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        h1 {
            text-align: center;
        }

        nav {
            display: grid;
            grid-template-columns: 2fr 1fr;
            background-color: skyblue;
        }

        .left {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            background-color: skyblue;
            font-size: 20px;
            height: 70px;
        }

        .right {
            background-color: skyblue;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding-right: 20px;
        }

        a {
            color: whitesmoke;
            text-decoration: none;
            padding: 10px 20px;
        }

        a:hover {
            background-color: lightgray;
            color: black;
        }

        .search-container {
            display: flex;
            align-items: center;
            border: 1px solid gray;
            border-radius: 12px;
            padding: 5px 10px;
            background-color: white;
        }

        .search-container input {
            border: none;
            outline: none;
            width: 390px;
            height: 30px;
            padding-left: 10px;
            font-size: 16px;
        }

        .search-container i {
            margin: 0 5px;
            cursor: pointer;
            font-size: 18px;

        }

        .profile-dropdown {
            position: relative;
        }

        .profile-icon {
            font-size: 32px;
            color: whitesmoke;
            cursor: pointer;
            
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: white;
            min-width: 200px;
            box-shadow: 0px 8px 16px gray;
            z-index: 1;
            border-radius: 5px;
            padding: 10px;
        }

        .dropdown-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            width: 250px;
        }

        .dropdown-row a {
            flex: 1;
            padding: 10px;
            background-color: #f0f0f0;
            text-align: center;
            border-radius: 5px;
            color: black;
        }

        .dropdown-row a:hover {
            background-color: lightgray;
        }

        .dropdown-content a {
            color: black;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            border-radius: 5px;
        }

        .dropdown-content a:hover {
            background-color: lightgray;
        }

        .profile-dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>

<body>
    <h1>E-COMMERCE WEBSITE</h1>

    <nav>
        <div class="left">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="/contact.html">Contact</a>

            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search items" />
                <i class="fas fa-camera"></i>
                <i class="fas fa-microphone"></i>
            </div>
        </div>

        <div class="right">
            <div class="profile-dropdown">
                <i class="fas fa-user-circle profile-icon"></i>
                <div class="dropdown-content">

                    <!-- Side-by-side login & signup -->
                    <div class="dropdown-row">
                        <a href="login.html"><i class="fas fa-user"></i> Login</a>
                        <a href="signup.html"><i class="fas fa-user-plus"></i> Signup</a>
                    </div>
                    <a href="profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                    <a href="orders.html"><i class="fas fa-box"></i> Orders</a>
                    <a href="wishlist.html"><i class="fas fa-heart"></i> Wishlist</a>
                    <a href="giftcards.html"><i class="fas fa-gift"></i> Giftcards</a>
                    <a href="address.html"> <i class="fa-solid fa-location-dot icon"></i> Address</a>
                    <a href="logout.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>
</body>

</html>
