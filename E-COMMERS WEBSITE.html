<!DOCTYPE html>
<html>

<head>
    <title>E-COMMERCE WEBSITE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/fontawesome.min.css">
    <style>
       
        h1 
        {
            text-align: center;
        }

        nav 
        {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: red;
        }

        .left 
        {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: rgb(48, 168, 211);
            font-size: 20px;
            height: 50px;
        }

        .right 
        {
            background: rgb(48, 168, 211);
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 10px;
            padding-right: 10px;
        }

        a 
        {
            color: whitesmoke;
            text-decoration: none;
            padding: 10px 25px;
        }

        a:hover 
        {
            background-color: lightgray;
            color: black;
        }

        .search-container 
        {
            display: flex;
            align-items: center;
            border: 1px solid gray;
            border-radius: 12px;
            padding: 5px 10px;
            background-color: white;
        }

        .search-container input 
        {
            border: none;
            outline: none;
            width: 250px;
            height: 30px;
            padding-left: 10px;
            font-size: 16px;
        }

        .search-container i 
        {
            margin: 0 5px;
            cursor: pointer;
            font-size: 18px;
        }

        .login-btn 
        {
            background-color: transparent;
            color: whitesmoke;
            text-decoration: none;
            padding: 10px 20px;
            right: 500px;
        }

        .login-btn:hover 
        {
            background-color: lightgray;
            color: black;
        }

        .profile-pic 
        {
            width: 40px;
            height: 40px;
            border-radius: 70%;
            object-fit: cover;
            border: 2px solid white;
            cursor: pointer;
            transition: 0.3s;
        }

        .profile-pic:hover 
        {
            border-color: gold;
        }

        .product-container 
        {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 20px;
            padding: 20px;
        }

        .product-item 
        {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 350px;
        }

        .product-item img 
        {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product-title 
        {
            font-weight: bold;
            margin-top: 10px;
        }

        .product-description 
        {
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>E-COMMERCE WEBSITE</h1>

    <nav>
        <div class="left">
            <a href="#">Home</a>
            <a href="file:///C:/Users/ramum/OneDrive/Documents/ecommers/product.html">Product</a>
            <a href="file:///C:/Users/ramum/OneDrive/Documents/ecommers/aboutecommers.html">About</a>
            <a href="file:///C:/Users/ramum/OneDrive/Documents/ecommers/contact.html">Contact</a>
        </div>

        <div class="right">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search items">
                <i class="fas fa-camera"></i>
                <i class="fas fa-microphone"></i>
            </div>

            <a class="login-btn" href="Loginpage.html">Login</a>

            <!-- Profile picture linked to profile page -->
            <a href="file:///C:/Users/ramum/OneDrive/Documents/ecommers/e_cprofile.html">
                <img src="#" alt="Profile" class="profile-pic">
            </a>
        </div>
    </nav>

  <!-- <div class="product-container" id="productContainer">
        <div class="product-item">
            <p class="product-title">Shirts</p>
            <img src="https://via.placeholder.com/150" alt="Shirts">
        </div>
        <div class="product-item">
            <p class="product-title">T-Shirts</p>
            <img src="https://via.placeholder.com/150" alt="T-Shirts">
        </div>
        <div class="product-item">
            <p class="product-title">Jeans</p>

        </div>
        <div class="product-item">
            <p class="product-title">Shoes</p>
            <img src="https://via.placeholder.com/150" alt="Shoes">
        </div>-->
        <!-- Add more products as needed -->
    </div>

    <script>
        const searchInput = document.getElementById("searchInput");
        const productItems = document.querySelectorAll(".product-item");

        searchInput.addEventListener("input", () => {
            const searchTerm = searchInput.value.toLowerCase();

            productItems.forEach(item => {
                const title = item.querySelector(".product-title").textContent.toLowerCase();
                item.style.display = title.includes(searchTerm) ? "block" : "none";
            });
        });
    </script>
</body>

</html>
